[package]
name = "spacey_sim"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Falcon 9-class first-stage 6DOF physics and in-browser CMA-ES trainer"
repository = "https://github.com/jtwolfe/SpaceY"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.100"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.2", features = ["js"] }
rand = { version = "0.8", features = ["small_rng"] }
# Same software libm on native and wasm32. Host glibc vs wasm compiler-rt
# drifted trajectories; keep one math path.
libm = { version = "0.2.16", default-features = false, features = ["force-soft-floats"] }

